[package]
name = "jx3-raid-manager"
version = "2.1.50"
description = "剑网三副本管家"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
dirs = "5"
chrono = { version = "0.4", features = ["std"] }
log = "0.4"
tauri-plugin-log = { version = "2" }
uuid = { version = "1", features = ["v4"] }
url = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-mcp-bridge = "0.9"
tauri-plugin-updater = "2"
winreg = "0.52"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "1"
futures = "0.3"
sysinfo = "0.31"
encoding_rs = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 生产构建优化（仅影响 CI 构建 + JX3_TAURI_FULL_LOCAL_BUILD=1 的本地完整构建）
# 本地快速构建（npm run tauri build）通过 tauriCliUtils.mjs 注入环境变量覆盖 LTO/strip/codegen-units，
# 避免本地反复构建时被 LTO 拖慢。
[profile.release]
# Fat LTO：跨 crate 全程序优化，缩小体积 + 提升运行时性能
lto = "fat"
# 仅保留对调试有用的符号，剥离其余符号以缩小二进制体积
strip = "symbols"
# 单 codegen unit：配合 LTO 实现最佳优化（构建更慢，产物更小更快）
codegen-units = 1
# 优化级别 2（默认值，显式声明便于追踪）
opt-level = 2
# panic 时 unwind，保留 Tauri 命令崩溃时的栈信息便于排查
panic = "unwind"
