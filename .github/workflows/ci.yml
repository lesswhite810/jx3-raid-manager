name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript 类型检查 + Vite 构建
        run: npm run build

      - name: 运行 Vitest 测试
        run: npm test

  rust:
    name: Rust 编译与测试
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ci-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Cargo 检查（编译告警与类型）
        shell: bash
        working-directory: src-tauri
        run: cargo check --release 2>&1

      - name: Cargo 测试
        shell: bash
        working-directory: src-tauri
        run: cargo test --release 2>&1
